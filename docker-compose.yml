services:
  app:
    container_name: app
    dns:
      - 8.8.8.8  # Google DNS
      - 1.1.1.1  # Cloudflare
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /var/www/
    volumes:
      - ./:/var/www/
      - ./docker/supervisord.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    restart: no
    depends_on:
      - postgres
      - redis
    networks:
      - app
    ports:
      - "${DOCKER_APP_PORT}:5173"

  nginx:
    image: nginx:alpine
    container_name: nginx_app
    restart: no
    ports:
      # Valet Linux: valet proxy <project> http://localhost:8080
      - "${DOCKER_NGINX_PORT}:80"
    environment:
      FASTCGI_PASS: app:9000
    volumes:
      - ./public:/var/www/public
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/default.conf:/etc/nginx/templates/default.conf.template
    depends_on:
      - app
    networks:
      - app

  postgres:
    container_name: postgres_app
    # Pin major version — postgres:latest (18+) changed the data dir layout
    # and breaks existing volumes mounted at /var/lib/postgresql/data.
    image: postgres:16
    restart: no
    ports:
      - "${DOCKER_DB_PORT}:5432"
    env_file:
      - .env
    volumes:
      - pgsql-rjet:/var/lib/postgresql/data
      - ./docker/postgresql/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  redis:
    container_name: redis_app
    image: redis:alpine
    restart: no
    ports:
      - "${DOCKER_REDIS_PORT}:6379"
    volumes:
      - redis-rjet:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

volumes:
  pgsql-rjet:
    driver: local
    name: pgsql-rjet
  redis-rjet:
    driver: local
    name: redis-rjet

networks:
  app:
    driver: bridge
    name: rjet-app
